name: Udemy Pro Coupon Bot

on:
  schedule:
    # تشغيل تلقائي كل 15 دقيقة
    - cron: '*/15 * * * *'
  workflow_dispatch: # يسمح لك بالتشغيل اليدوي للتجربة

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Udemy Bot
        run: python udemy_bot.py

      - name: Save sent courses state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sent_courses.txt || echo "No changes to commit"
          git commit -m "Update sent courses [skip ci]" || echo "No changes to commit"
          git push
