
name: Udemy Coupons Bot
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install feedparser requests deep-translator
      - run: python udemy_bot.py
      - run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sent_coupons.txt || true
          git diff --staged --quiet || git commit -m "Update sent coupons [skip ci]"
          git pull origin main --rebase || true
          git push || true
